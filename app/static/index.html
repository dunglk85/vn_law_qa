<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Knowledge Assistant</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-icon">&#x1F50D;</div>
      <h1>Knowledge Assistant</h1>
      <p>Ask questions about your company documents</p>
    </header>

    <div class="card">
      <div class="textarea-wrapper">
        <textarea
          id="question"
          placeholder="What would you like to know?"
        ></textarea>
      </div>
      <div class="input-bar">
        <span class="hint">
          <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to send
        </span>
        <div class="btn-group">
          <button id="clearBtn" class="btn-secondary">Clear</button>
          <button id="askBtn" class="btn-primary">Ask</button>
        </div>
      </div>
    </div>

    <div id="responseCard" class="card hidden">
      <div class="response-header">
        <span class="avatar">AI</span>
        <span class="label">Answer</span>
      </div>
      <div id="answer"></div>

      <div id="sourcesBlock">
        <div class="sources-label">Sources</div>
        <div id="sources" class="source-list"></div>
      </div>
    </div>
  </div>

  <script>
    const askBtn = document.getElementById('askBtn');
    const clearBtn = document.getElementById('clearBtn');
    const textarea = document.getElementById('question');
    const answerDiv = document.getElementById('answer');
    const respCard = document.getElementById('responseCard');
    const sourcesList = document.getElementById('sources');
    const sourcesBlock = document.getElementById('sourcesBlock');

    function escapeHtml(text) {
      return (text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderSources(sources) {
      if (!sources || !sources.length) {
        sourcesBlock.style.display = 'none';
        sourcesList.innerHTML = '';
        return;
      }
      sourcesBlock.style.display = '';
      sourcesList.innerHTML = sources
        .map((s) => `<div class="source-item">${escapeHtml(s)}</div>`)
        .join('');
    }

    function showTyping() {
      answerDiv.innerHTML =
        '<div class="typing"><span></span><span></span><span></span></div>';
    }

    async function submitQuestion() {
      const q = textarea.value.trim();
      if (!q) {
        textarea.focus();
        return;
      }
      askBtn.disabled = true;
      renderSources([]);
      respCard.classList.remove('hidden');
      showTyping();
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q }),
        });
        const data = await res.json();
        answerDiv.innerHTML = (data.answer || '').replace(/\n/g, '<br>');
        renderSources(data.sources || []);
      } catch (err) {
        answerDiv.innerHTML =
          '<span class="error">Error: ' +
          escapeHtml(err?.message || 'request failed') +
          '</span>';
        renderSources([]);
      } finally {
        askBtn.disabled = false;
      }
    }

    askBtn.addEventListener('click', submitQuestion);
    textarea.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        submitQuestion();
      }
    });

    clearBtn.addEventListener('click', () => {
      textarea.value = '';
      answerDiv.innerHTML = '';
      renderSources([]);
      respCard.classList.add('hidden');
      textarea.focus();
    });
  </script>
</body>
</html>
