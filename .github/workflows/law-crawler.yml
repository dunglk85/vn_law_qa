name: Law Crawler — Weekly Data Update

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      skip_phap_dien:
        description: "Skip Pháp Điển crawl (local files unchanged)"
        type: boolean
        default: false

jobs:
  crawl:
    name: Run medallion pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd law-crawler
          pip install -r requirements.txt

      - name: Run full pipeline
        if: ${{ !inputs.skip_phap_dien }}
        run: |
          cd law-crawler
          python -m src.pipeline

      - name: Run pipeline (skip Pháp Điển)
        if: ${{ inputs.skip_phap_dien }}
        run: |
          cd law-crawler
          python -m src.pipeline --from silver

      - name: Upload data artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: law-data-${{ github.run_id }}
          path: |
            law-crawler/data/gold/*.parquet
            law-crawler/metrics/quality.json
          retention-days: 30

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: law-metrics-${{ github.run_id }}
          path: law-crawler/metrics/quality.json
          retention-days: 30
