services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cka-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  app:
    image: cka-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cka-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis/redis-stack:7.4.0-v0
    container_name: cka-redis
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
  legal-research-agent:
    image: cka-a2a-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.a2a
    container_name: cka-legal-research
    ports:
      - "8101:8101"
    env_file:
      - .env
    environment:
      - A2A_AGENT=legal-research
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8101/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  citation-checker-agent:
    image: cka-a2a-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.a2a
    container_name: cka-citation-checker
    ports:
      - "8102:8102"
    env_file:
      - .env
    environment:
      - A2A_AGENT=citation-checker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8102/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  response-synthesizer-agent:
    image: cka-a2a-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.a2a
    container_name: cka-response-synth
    ports:
      - "8103:8103"
    env_file:
      - .env
    environment:
      - A2A_AGENT=response-synthesizer
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8103/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  pgweb:
    container_name: pgweb
    restart: always
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      - postgres
volumes:
  pgdata:
  redis-data:
