services:
    law-mysql:
        image: mysql:8.4
        container_name: law-mysql
        restart: unless-stopped
        ports:
            - "${LAW_DB_PORT:-3306}:3306"
        env_file:
            - .env
        environment:
            MYSQL_ROOT_PASSWORD: "${LAW_DB_PASSWORD}"
            MYSQL_DATABASE: "${LAW_DB_NAME:-law}"
        volumes:
            - law_mysql_data:/var/lib/mysql
        networks:
            - law-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    phpmyadmin:
        image: phpmyadmin:5.2
        container_name: law-phpmyadmin
        restart: always
        ports:
            - "8082:80"
        depends_on:
            law-mysql:
                condition: service_healthy
        networks:
            - law-network
        environment:
            PMA_HOST: law-mysql
            UPLOAD_LIMIT: 100M

volumes:
    law_mysql_data:

networks:
    law-network:
